  <meta charset="UTF-8" />

  <title>SynCatch</title>
  <script>
    // The splash paints before React boots, so read the persisted theme here.
    // Without this it renders the dark brand palette and then jumps to the
    // user's theme the moment the app mounts.
    try {
      var cached = JSON.parse(localStorage.getItem('missioncontrol-theme') || 'null');
      if (cached && cached.themeId) document.documentElement.dataset.theme = cached.themeId;
    } catch (e) { /* first run, or storage blocked */ }
  </script>
  <style>
    /* Boot splash, shared with AnimatedLoading so the React handoff is seamless.
       Follows the app theme: background, lettering and the "Catch" accent all take the theme's colours. */
    .sc-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; background: linear-gradient(180deg, rgb(var(--bg-base, 6 10 12)) 0%, rgb(var(--bg-soft, 11 16 19)) 100%); color: rgb(var(--text-primary, 244 246 251)); font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --sc-accent: rgb(var(--accent, 62 139 255)); --sc-caught: #22B573; }
    /* Graph-paper dots, strongest behind the logo and fading out toward the edges. */
    .sc-splash::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(rgb(var(--text-primary, 244 246 251) / 0.2) 1.2px, transparent 1.7px); background-size: 22px 22px; background-position: center; -webkit-mask-image: radial-gradient(ellipse 55% 42% at 50% 46%, #000, transparent); mask-image: radial-gradient(ellipse 55% 42% at 50% 46%, #000, transparent); animation: sc-fade 1.2s ease-out both; }
    .sc-center { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 24px; text-align: center; animation: sc-rise 0.9s cubic-bezier(0.2, 0.7, 0, 1) both; }
    .sc-lockup { display: block; width: 248px; height: auto; overflow: visible; }
    .sc-about { max-width: 320px; text-wrap: balance; margin: 20px 0 0; font-size: 15px; line-height: 1.5; color: rgb(var(--text-secondary, 170 180 186)); }
    /* One beat. Sync: the S winds up and flings a task, a note and a mission over "yn".
       Catch: the C tilts up to meet each one and chomps it; after the third, the caught dot lands green
       and both letters hop. Parts are SYNCATCH_WORD_*; the throw ends in the C's mouth. */
    .sc-sglyph { transform-box: fill-box; transform-origin: 50% 100%; animation: sc-send 3.6s ease-in-out infinite; }
    .sc-cglyph { transform-box: fill-box; transform-origin: 50% 100%; animation: sc-clamp 3.6s ease-in-out infinite; }
    .sc-item { offset-path: path("M 50 -62 C 58 -118 190 -132 222 -84 C 230 -70 220 -44 205 -35"); offset-rotate: 0deg; transform-box: fill-box; transform-origin: center; transform: scale(0); animation: sc-fly 3.6s linear infinite both; }
    .sc-i2 { animation-delay: 0.75s; }
    .sc-i3 { animation-delay: 1.5s; }
    .sc-dot { fill: var(--sc-caught); transform-box: fill-box; transform-origin: center; transform: scale(0); animation: sc-dot 3.6s ease-out infinite; }
    .sc-ripple { fill: none; stroke: var(--sc-caught); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: sc-ripple 3.6s ease-out infinite; }
    /* "Sync aachaa?" asks, "Aachu" answers on the same beat. */
    .sc-status { position: absolute; bottom: calc(36px + env(safe-area-inset-bottom)); display: inline-grid; padding: 8px 16px; border: 1px solid rgb(var(--text-primary, 244 246 251) / 0.08); border-radius: 999px; background: rgb(var(--text-primary, 244 246 251) / 0.05); font-size: 14px; font-weight: 500; animation: sc-fade 0.8s ease-out 0.4s both; }
    .sc-status > span { grid-area: 1 / 1; text-align: center; }
    .sc-q { color: rgb(var(--text-secondary, 170 180 186)); animation: sc-q 3.6s ease-in-out infinite; }
    .sc-a { color: var(--sc-caught); opacity: 0; animation: sc-a 3.6s ease-in-out infinite; }
    @keyframes sc-fly { 0% { offset-distance: 0%; transform: scale(0) rotate(-20deg); animation-timing-function: cubic-bezier(0.3, 0.2, 0.5, 1); } 4% { transform: scale(1) rotate(0deg); } 22% { offset-distance: 100%; transform: scale(1) rotate(8deg); } 26%, 100% { offset-distance: 100%; transform: scale(0); } }
    /* S throws at 0%, 20.8% and 41.7% (wind-up just before each), hops at 70%. */
    @keyframes sc-send {
      0% { transform: rotate(8deg) scale(1.04, 0.96); }
      4% { transform: rotate(-3deg); }
      8%, 13% { transform: none; }
      16% { transform: rotate(-10deg) scale(0.96, 1.04); }
      21% { transform: rotate(8deg) scale(1.04, 0.96); }
      25% { transform: rotate(-3deg); }
      29%, 34% { transform: none; }
      37% { transform: rotate(-10deg) scale(0.96, 1.04); }
      42% { transform: rotate(8deg) scale(1.04, 0.96); }
      46% { transform: rotate(-3deg); }
      50%, 67% { transform: none; }
      70% { transform: translateY(-7px) scale(0.97, 1.04); }
      74% { transform: scale(1.05, 0.94); }
      78%, 91% { transform: none; }
      96%, 100% { transform: rotate(-10deg) scale(0.96, 1.04); }
    }
    /* C catches at 22%, 42.8% and 63.7% (tilting up to meet each), hops just after the S. */
    @keyframes sc-clamp {
      0%, 14% { transform: none; }
      19% { transform: rotate(-7deg); }
      22% { transform: rotate(2deg) scale(0.9, 0.95); }
      25% { transform: translateY(-3px) scale(1.03); }
      28%, 35% { transform: none; }
      40% { transform: rotate(-7deg); }
      43% { transform: rotate(2deg) scale(0.9, 0.95); }
      46% { transform: translateY(-3px) scale(1.03); }
      49%, 56% { transform: none; }
      61% { transform: rotate(-7deg); }
      64% { transform: rotate(2deg) scale(0.88, 0.94); }
      67% { transform: translateY(-3px) scale(1.03); }
      70% { transform: none; }
      73% { transform: translateY(-7px) scale(0.97, 1.04); }
      77% { transform: scale(1.05, 0.94); }
      81%, 100% { transform: none; }
    }
    @keyframes sc-dot { 0%, 64% { transform: scale(0); fill: var(--sc-caught); } 69% { transform: scale(1.4); } 74%, 90% { transform: scale(1); fill: var(--sc-caught); } 98%, 100% { transform: scale(0); fill: var(--sc-caught); } }
    @keyframes sc-ripple { 0%, 66% { opacity: 0; transform: scale(1); } 68% { opacity: 0.7; transform: scale(1.1); } 88%, 100% { opacity: 0; transform: scale(3); } }
    @keyframes sc-q { 0%, 64% { opacity: 1; transform: none; } 68%, 92% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 1; transform: none; } }
    @keyframes sc-a { 0%, 65% { opacity: 0; transform: translateY(6px); } 70%, 88% { opacity: 1; transform: none; } 94%, 100% { opacity: 0; transform: translateY(-6px); } }
    @keyframes sc-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes sc-fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sc-splash::before, .sc-center, .sc-sglyph, .sc-cglyph, .sc-item, .sc-dot, .sc-ripple, .sc-status, .sc-q, .sc-a { animation: none; } }
  </style>

  <script>
    // Remove initial loading when React mounts
    window.removeInitialLoading = function() {
      const el = document.getElementById('initial-loading');
      if (el) {
        el.style.transition = 'opacity 0.3s ease-out';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }
    }
